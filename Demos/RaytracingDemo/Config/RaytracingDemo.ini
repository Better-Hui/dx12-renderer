; RaytracingDemo project settings.
; Saved by the ImGui settings action and loaded on the next launch.

[Renderer]
PathTracingBackend = inline
PathTracingDispatch = full-resolution
DirectLighting = restirdi
IndirectLighting = none
MaxBounces = 1
Accumulation = false
SoftShadows = false
