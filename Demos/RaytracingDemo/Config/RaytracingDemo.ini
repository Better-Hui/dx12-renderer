; Startup values for RaytracingDemo.
; The file is copied beside the executable by the RaytracingDemo build.
; Environment variables override values from this file.
; Changes take effect on the next demo launch.

[Renderer]
PathTracingBackend = inline
DirectLighting = restirdi
IndirectLighting = restirgi
MaxBounces = 3
Accumulation = false
SoftShadows = false
AsyncCompute = false
ParallelDirectCommandRecording = true
MeshletGBuffer = true
MeshletDebug = false
MeshletBackend = task
MaterialShading = pbr

[Denoiser]
Algorithm = nrd
OIDNStaticSpp = 16

[DLSS]
Mode = quality
RayReconstruction = false
FrameGeneration = false

[ReSTIRDI]
CandidateCount = 8
InitialVisibility = true
TemporalResampling = false
TemporalBiasCorrection = basic
TemporalVisibilityShortcut = false
TemporalPermutationSampling = true
BoilingFilter = true
BoilingFilterStrength = 0.20
SpatialResampling = true
SpatialBiasCorrection = basic
SpatialNeighborCount = 1
SpatialDisocclusionBoostSampleCount = 8
SpatialTargetHistoryLength = 0
SpatialMaterialSimilarityTest = true
FinalVisibility = true
ReuseFinalVisibility = true
DiscardInvisibleFinalSamples = false
FinalVisibilityMaxAge = 4
FinalVisibilityMaxDistance = 16.0

[ReSTIRGI]
InitialCandidateCount = 1
TemporalResampling = false
SpatialResampling = true
TemporalJacobian = true
RayTracedSpatialBiasCorrection = false
SpatialNeighborCount = 5

[Bloom]
Enabled = true
Backend = raster
CudaMethod = classic-pyramid
Threshold = 0.55
SoftThreshold = 0.30
Intensity = 0.75
PyramidLevels = 4
BoxFilterSigma = 1.0
SharedMemoryDownsampling = false
ThreadBlockSize = 16

[Debug]
GpuTiming = false
ProfilerDisplayRefreshIntervalSeconds = 1.0
