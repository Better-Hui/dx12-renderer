; Startup values for RaytracingDemo.
; The file is copied beside the executable by the RaytracingDemo build.
; Environment variables override values from this file.
; Changes take effect on the next demo launch.

[Renderer]
PathTracingBackend = inline
PathTracingDispatch = full-resolution
DirectLighting = restirdi
IndirectLighting = restirgi
MaxBounces = 3
Accumulation = false
SoftShadows = false
AsyncCompute = false
DebugSerializeAsyncCompute = false
CopyQueueValidation = false
ParallelDirectCommandRecording = true
StressTestSpheres = false
DynamicRTASRefit = false
MeshletGBuffer = true
MeshletDebug = false
MeshletDebugTarget = 0
MeshletBackend = task
DebugLightingTexture = 0
MaterialShading = pbr

[Camera]
FieldOfView = 22.8952
NearClipPlane = 10.0
FarClipPlane = 100000.0
MouseRotateSpeed = 0.1
MousePanSpeed = 0.04
MouseDollySpeed = 0.04
MouseWheelDollySpeed = 0.5

[Denoiser]
Algorithm = nrd
OIDNStaticSpp = 16

[NRD]
Mode = reblur-diffuse
DenoisingRange = 100000.0
RelaxDiffuseMaxAccumulatedFrameNum = 32
RelaxDiffuseMaxFastAccumulatedFrameNum = 6
RelaxHistoryFixFrameNum = 3
RelaxHistoryFixBasePixelStride = 14
RelaxFastHistoryClampingSigmaScale = 2.0
RelaxDiffusePrepassBlurRadius = 30.0
RelaxMinHitDistanceWeight = 0.1
RelaxSpatialVarianceEstimationHistoryThreshold = 3
RelaxDiffusePhiLuminance = 2.0
RelaxLobeAngleFraction = 0.5
RelaxRoughnessFraction = 0.15
RelaxAtrousIterationNum = 5
RelaxDepthThreshold = 0.003
RelaxLuminanceEdgeStoppingRelaxation = 0.5
RelaxNormalEdgeStoppingRelaxation = 0.3
RelaxRoughnessEdgeStoppingRelaxation = 1.0
RelaxEnableAntiFirefly = false
RelaxEnableRoughnessEdgeStopping = true
ReblurHitDistanceA = 3.0
ReblurHitDistanceB = 0.1
ReblurHitDistanceC = 20.0
ReblurMaxAccumulatedFrameNum = 30
ReblurMaxFastAccumulatedFrameNum = 6
ReblurHistoryFixFrameNum = 3
ReblurHistoryFixBasePixelStride = 14
ReblurFastHistoryClampingSigmaScale = 2.0
ReblurDiffusePrepassBlurRadius = 30.0
ReblurMinHitDistanceWeight = 0.1
ReblurMinBlurRadius = 1.0
ReblurMaxBlurRadius = 30.0
ReblurLobeAngleFraction = 0.15
ReblurRoughnessFraction = 0.15
ReblurPlaneDistanceSensitivity = 0.02
ReblurFireflySuppressorMinRelativeScale = 2.0
ReblurEnableAntiFirefly = true

[SVGF]
AtrousIterations = 1
TemporalAlpha = 0.08
MomentsAlpha = 0.2
PhiColor = 4.0
PhiNormal = 64.0
PhiDepth = 1.0

[DLSS]
Mode = quality
RayReconstruction = false
FrameGeneration = false

[Display]
; HDR10 uses a native R10G10B10A2 swapchain, Rec.2020 primaries, and ST.2084/PQ.
; It safely falls back to SDR when Windows or the active output does not expose HDR10.
HDR10 = false

[AutoExposure]
Enabled = true
AdaptationTau = 1.1
MinLogLuminance = -10.0
MaxLogLuminance = 2.0

[ReSTIRDI]
CandidateCount = 8
InitialVisibility = true
TemporalResampling = false
TemporalBiasCorrection = basic
TemporalMaxHistoryLength = 20
TemporalVisibilityShortcut = false
TemporalPermutationSampling = false
TemporalMaterialSimilarityTest = false
TemporalIgnoreGeometry = false
TemporalNormalSimilarityThreshold = 0.50
TemporalDepthSimilarityThreshold = 0.10
TemporalMaterialSimilarityThreshold = 0.05
BoilingFilter = false
BoilingFilterStrength = 0.20
SpatialResampling = true
SpatialBiasCorrection = basic
SpatialNeighborCount = 1
SpatialDisocclusionBoostSampleCount = 8
SpatialTargetHistoryLength = 0
SpatialSamplingRadius = 32.0
SpatialNormalSimilarityThreshold = 0.50
SpatialDepthSimilarityThreshold = 0.10
SpatialMaterialSimilarityTest = true
SpatialMaterialSimilarityThreshold = 0.50
FinalVisibility = true
ReuseFinalVisibility = true
DiscardInvisibleFinalSamples = false
FinalVisibilityMaxAge = 4
FinalVisibilityMaxDistance = 16.0

[ReSTIRGI]
InitialCandidateCount = 1
TemporalResampling = false
SpatialResampling = true
TemporalJacobian = true
RayTracedSpatialBiasCorrection = false
TemporalMaxHistoryLength = 20
SpatialMaxHistoryLength = 32
MaxSampleAge = 20
SpatialNeighborCount = 5
TemporalNormalSimilarityThreshold = 0.80
TemporalPositionSimilarityThreshold = 0.10
SpatialNormalSimilarityThreshold = 0.70
SpatialPositionSimilarityThreshold = 0.20
SpatialSamplingRadius = 30.0
MaxJacobian = 10.0
MaxSpatialWeight = 32.0

[Bloom]
Enabled = true
Backend = raster
CudaMethod = classic-pyramid
Threshold = 0.55
SoftThreshold = 0.30
Intensity = 0.75
PyramidLevels = 4
BoxFilterSigma = 1.0
SharedMemoryDownsampling = false
ThreadBlockSize = 16

[Debug]
GpuTiming = false
CaptureTimingHistory = false
TimingHistoryCapacity = 300
ReSTIRGIStageTiming = false
ProfilerDisplayRefreshIntervalSeconds = 1.0

[Lights]
DirectionalEnabled = true
PointEnabled = true
AreaEnabled = true
AnimatePointLights = false
; Sky values and DirectionalCount/PointCount/SpotCount/AreaCount are emitted by Save Settings.

[Lights.EditorDefaults]
NewDirectionalDirectionX = -0.35
NewDirectionalDirectionY = 0.8
NewDirectionalDirectionZ = -0.48
NewDirectionalColorX = 1.0
NewDirectionalColorY = 0.95
NewDirectionalColorZ = 0.82
NewDirectionalIntensity = 1.0
NewDirectionalAngularRadius = 0.0
NewPointColorX = 1.0
