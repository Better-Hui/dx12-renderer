NewPointIntensity = 18.0
NewPointRange = 24.0
NewPointSourceRadius = 0.25
RandomPointSpawnRadius = 28.0
NewSpotPositionX = 0.0
NewSpotPositionY = 4.0
NewSpotPositionZ = 0.0
NewSpotDirectionX = 0.0
NewSpotDirectionY = -1.0
NewSpotDirectionZ = 0.0
NewSpotColorX = 1.0
NewSpotColorY = 0.85
NewSpotColorZ = 0.55
NewSpotIntensity = 18.0
NewSpotRange = 24.0
NewSpotInnerAngleDegrees = 20.0
NewSpotOuterAngleDegrees = 30.0
NewAreaPositionX = 0.0
NewAreaPositionY = 4.0
NewAreaPositionZ = 0.0
NewAreaNormalX = 0.0
NewAreaNormalY = -1.0
NewAreaNormalZ = 0.0
NewAreaSizeX = 2.0
NewAreaSizeY = 2.0
NewAreaColorX = 1.0
NewAreaColorY = 0.85
NewAreaColorZ = 0.55
NewAreaIntensity = 8.0
NewAreaRange = 35.0
